<style>

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#fff7f2 0%,#f7f7ff 50%,#f2f9ff 100%);
  color:#222
}

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column
}

.hero{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 20px
}

.content{
  width:100%;
  max-width:720px;
  text-align:center
}

.logo{
  width:176px;
  height:176px;
  margin:0 auto 25px;
  display:block;
  background:transparent;
  object-fit:contain;
  border:0;
  padding:0;
  filter:drop-shadow(0 12px 20px rgba(255,107,53,.20))
}

h1{
  margin:0 0 15px;
  font-size:clamp(40px,8vw,64px);
  letter-spacing:-2px
}

.subtitle{
  max-width:560px;
  margin:0 auto 35px;
  font-size:20px;
  line-height:1.55;
  color:#666
}

.play-button,
.donate-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:230px;
  padding:15px 25px;
  border-radius:12px;
  color:white;
  text-decoration:none;
  font-size:17px;
  font-weight:700;
  transition:transform .15s ease,box-shadow .15s ease
}

.play-button{
  background:#222
}

.donate-button{
  background:#ff6b35
}

.play-button:hover,
.donate-button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,.18)
}

.play-icon{
  margin-right:10px;
  font-size:20px
}

.cta-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:14px
}

.donate-icon{
  margin-right:10px;
  font-size:18px
}

.footer{
  padding:25px 20px 30px;
  text-align:center;
  font-size:14px;
  color:#777
}

.footer a{
  color:#666;
  text-decoration:none;
  margin:0 10px
}

.footer a:hover{
  color:#222;
  text-decoration:underline
}

.copyright{
  margin-top:12px;
  color:#aaa
}

</style>
</head>
